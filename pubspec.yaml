name: ne_yesek
description: "Bugün Ne Yesek? — Dünya mutfaklarından yemek öneren karar çarkı."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  shared_preferences: ^2.5.3
  flutter_fortune_wheel: ^1.3.1
  in_app_purchase: ^3.2.0
  audioplayers: ^6.1.1
  confetti: ^0.7.0
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#100B22"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/foods/
    - assets/data/
    - assets/data/foods/
    - assets/sounds/




